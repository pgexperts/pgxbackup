name: static-analysis

# Static analysis runs three orthogonal tools. The gate fails on any finding so that the codebase converges on a clean baseline.
# Where a finding is intentional (e.g., a setjmp pattern that flow-based analyzers misinterpret), it should be suppressed via the
# tool's local annotation, not by relaxing the workflow.
#
# - cppcheck: data-flow oriented; cheap, catches integer overflow, null-deref, leak, format-string, and many C-specific bugs.
# - scan-build (clang-static-analyzer): path-sensitive, finds use-after-free, double-free, division-by-zero, etc. Slower.
# - clang-tidy: lint-style and AST-pattern checks. Curated check set in .clang-tidy at repo root; we deliberately skip the noisy
#   modernize/cppcoreguidelines families which are C++-oriented.
#
# The expensive ones (scan-build, clang-tidy) skip on documentation-only PRs by checking changed paths. For the small ones (cppcheck)
# the cost-benefit favors always running.

on:
  push:
    branches:
      - main
      - '**-ci'
      - '**-cig'
  pull_request:
    branches:
      - main
      - '**-ci'
      - '**-cig'

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Catches the agent-introduced bug class where prose like `MACRO_NAME*/OTHER_MACRO` inside a /* ... */ block accidentally closes
  # the comment, or `*_RETURN/*_RETURN_VOID` introduces a nested /* warning. The compiler also catches these (we hit them once;
  # they cost ~10 minutes to diagnose), but a 2-second pre-build check fails faster and clearer than a 5-minute build that errors
  # 200 lines deep in cascading "unknown type" messages.
  comment-sanity:
    name: comment-block sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Scan block comments for stray */ or /*
        run: |
          cd "${GITHUB_WORKSPACE}"
          # Find every multi-line /***...***/ block and report any line that contains a *(slash) or (slash)* sequence inside it.
          # The block delimiters themselves (lines that are nothing but asterisks plus /* or */) are excluded. Vendored files
          # (xxhash, MD5) carry their own block-comment styles that we don't want to rewrite -- skip via the !-name pattern.
          find src test \
              \( -name '*.c' -o -name '*.h' -o -name '*.c.inc' \) \
              ! -name '*.vendor.*' \
              | xargs -I {} awk '
                  /^\/\*\*\*\*\*+/        { in_block=1; next }
                  /^\*\*\*\*\*+\// && in_block { in_block=0; next }
                  in_block && /\*\// { print FILENAME ":" NR " (premature */): " $0; bad=1 }
                  in_block && /\/\*/ { print FILENAME ":" NR " (nested /*):    " $0; bad=1 }
                  END { exit bad }
              ' {} \
              || { echo; echo "FAIL: comment-block sanity check found stray comment delimiters."; \
                   echo "Rephrase to avoid */ and /* sequences inside the prose (e.g., MACRO_*/OTHER → 'MACRO_* and OTHER')."; \
                   exit 1; }
          echo "OK: no stray */ or /* inside block comments."

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install cppcheck
        run: |
          sudo apt-get update
          DEBCONF_NONINTERACTIVE_SEEN=true DEBIAN_FRONTEND=noninteractive sudo apt-get install -y cppcheck

      # cppcheck flag rationale:
      #   --enable=warning,style,performance,portability — useful checks; we skip `unusedFunction` (false positives in unity builds)
      #     and `missingInclude` (pgBackRest leans on transitive includes by design).
      #   --suppressions-list — project-curated allowlist (see .cppcheck-suppress at repo root). Each entry must have a comment.
      #   --error-exitcode=1 — fail the workflow on ANY finding. The suppressions list is how we accept findings, not by ignoring.
      #   --inline-suppr — honor `// cppcheck-suppress <id>` comments in source.
      #   --std=c99 — match meson's c_std.
      #   -j$(nproc) — parallel.
      #   src/ — only the production code; tests have their own conventions cppcheck disagrees with.
      - name: Run cppcheck
        run: |
          cd "${GITHUB_WORKSPACE}"
          touch .cppcheck-suppress
          cppcheck \
              --enable=warning,style,performance,portability \
              --suppress=unusedFunction \
              --suppress=missingInclude \
              --suppressions-list=.cppcheck-suppress \
              --inline-suppr \
              --error-exitcode=1 \
              --std=c99 \
              --quiet \
              -j"$(nproc)" \
              -I src \
              src/

  scan-build:
    name: scan-build (clang-static-analyzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          path: pgbackrest

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libbacktrace-dev is required (see sanitizers.yml for rationale -- the .so is autodetected, the header is not).
          DEBCONF_NONINTERACTIVE_SEEN=true DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
              build-essential clang clang-tools meson pkg-config \
              libbacktrace-dev \
              libssl-dev zlib1g-dev libxml2-dev libpq-dev libyaml-dev \
              liblz4-dev libzstd-dev libbz2-dev libssh2-1-dev

      # scan-build wraps the build. We do meson setup outside the wrapper (it doesn't compile anything) so scan-build only sees the
      # actual translation-unit compilations.
      - name: Configure
        env:
          CC: clang
        run: |
          cd "${GITHUB_WORKSPACE}"
          meson setup -Dbuildtype=debug -Dwerror=true build pgbackrest

      # --status-bugs flips the exit code: scan-build returns nonzero if any bug is reported. Without it, scan-build always exits 0
      # and you have to grep the report to discover failures.
      # -o ./scan-build-report dumps an HTML report we upload as artifact for triage.
      - name: Build under scan-build
        run: |
          cd "${GITHUB_WORKSPACE}"
          scan-build --status-bugs -o ./scan-build-report ninja -C build

      - name: Upload scan-build report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scan-build-report-${{ github.run_id }}
          path: ${{ github.workspace }}/scan-build-report/
          retention-days: 14
          if-no-files-found: warn

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          path: pgbackrest

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libbacktrace-dev is required (see sanitizers.yml for rationale).
          DEBCONF_NONINTERACTIVE_SEEN=true DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
              build-essential clang clang-tidy meson pkg-config \
              libbacktrace-dev \
              libssl-dev zlib1g-dev libxml2-dev libpq-dev libyaml-dev \
              liblz4-dev libzstd-dev libbz2-dev libssh2-1-dev jq

      # meson emits compile_commands.json into the build dir; clang-tidy reads it for include paths and -D flags. The build itself
      # also generates the *.auto.h headers that clang-tidy will need when parsing src/ — so a successful ninja must precede tidy.
      - name: Configure & build (for compile_commands.json and generated headers)
        env:
          CC: clang
        run: |
          cd "${GITHUB_WORKSPACE}"
          meson setup -Dbuildtype=debug build pgbackrest
          ninja -C build

      # We run clang-tidy on every translation unit listed in compile_commands.json that lives under pgbackrest/src/. Test files,
      # vendored code (e.g., xxhash), and the build-time codegen are intentionally excluded — they have their own correctness story.
      # The tidy check set is in .clang-tidy at repo root; not duplicating it here.
      - name: Run clang-tidy
        run: |
          cd "${GITHUB_WORKSPACE}"
          # Build a list of files to check from compile_commands.json, filtering to src/ only and excluding generated *.auto.* and
          # the build-code subtree (it's a separate executable that isn't part of the production binary's contract).
          jq -r '.[].file' build/compile_commands.json \
              | grep -E '/pgbackrest/src/' \
              | grep -v '/src/build/' \
              | grep -v '\.auto\.' \
              | sort -u > /tmp/tidy-files.txt
          echo "Will run clang-tidy on $(wc -l < /tmp/tidy-files.txt) files"

          # -p points at the build dir so clang-tidy finds compile_commands.json.
          # --warnings-as-errors='*' makes any check that fires a hard failure. The check set is conservative (.clang-tidy) so this
          # is the right default; broaden as the codebase converges.
          xargs -a /tmp/tidy-files.txt -n 50 -P "$(nproc)" \
              clang-tidy \
                  -p build \
                  --warnings-as-errors='*' \
                  --quiet
